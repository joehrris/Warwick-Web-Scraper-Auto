name: Scrape Warwick SU Orgs

# This tells GitHub WHEN to run the script
on:
  schedule:
    # Runs at 2:00 AM UTC every single day
    - cron: '0 2 * * *'
  workflow_dispatch: # This allows you to click a "Run" button manually

# We need to give the bot permission to push the JSON file back to the repo
permissions:
  contents: write

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout the repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the scraper
        run: python scraper.py

      - name: Commit and push if it changed
        run: |
          git config user.name "Automated Scraper"
          git config user.email "actions@users.noreply.github.com"
          git add warwick_orgs.json
          # Only commit if there are actual changes to avoid errors
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update organization list" && git push)
